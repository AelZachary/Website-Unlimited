<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unlimited - Slots</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0b0033;
    }
    footer {
      background-color: #d4d1e3;
    }
    nav a:hover, nav a.active {
      color: #00aaff;
    }
    .top-bar {
      font-size: 12px;
      padding: 2px 15px;
      background-color: #ffffff;
      color: #000;
      display: flex;
      justify-content: space-between;
    }
    .top-bar span {
      font-weight: bold;
    }
    .game-grid {
      background-color: #07003c;
      padding: 20px;
      border-radius: 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      justify-items: center;
    }
    .game-slot {
      background-color: #000;
      border: 2px solid #0af;
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.3s ease;
      width: 100px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .game-slot:hover {
      transform: scale(1.05);
      cursor: pointer;
    }
    .game-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .main-content {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px;
    }
    .ad {
      width: 80px;
      min-height: 100%;
      background-color: #5d5775;
      color: white;
      text-align: center;
      padding-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container-fluid px-0">
    <!-- Top Bar -->
    <div class="top-bar">
      <span>Contact Us</span>
      <div>
        <span class="me-3">Login</span>
        <span>Sign in</span>
      </div>
    </div>

    <!-- Fixed Header (matches casino.html) -->

      <div class="d-flex align-items-center">
        <img src="assets/home gambar/logo unlimited.jpeg" alt="Logo" height="60" class="me-2" />
        <div>
          <div style="font-size: 18px;"><strong>Unlimited</strong></div>
          <div style="font-size: 12px;">Break The Limit</div>
        </div>
      </div>
      <nav class="d-flex gap-3 align-items-center flex-wrap">
        <a href="home.html" class="text-white text-decoration-none">Home</a>
        <a href="slots.html" class="text-white text-decoration-none">Slots</a>
        <a href="casino.html" class="text-white text-decoration-none active">Casino</a>
        <a href="sports.html" class="text-white text-decoration-none">Sports</a>
        <a href="arcade.html" class="text-white text-decoration-none">Arcade</a>
        <a href="poker.html" class="text-white text-decoration-none">Poker</a>
        <a href="Live TV.html" class="text-white text-decoration-none">Live TV</a>
      </nav>
    </header>

    <!-- Main Section with Ads -->
    <div class="main-content">
      <div class="ad">Iklan</div>

      <div class="flex-fill px-3">
        <div class="game-grid">
          <a href="pong.html" class="game-slot"><img src="assets/slots/1.png" alt="Game 1"></a>
          <a href="pong.html" class="game-slot"><img src="assets/slots/2.png" alt="Game 2"></a>
          <a href="pong.html" class="game-slot"><img src="assets/slots/3.png" alt="Game 3"></a>
          <a href="pong.html" class="game-slot"><img src="assets/slots/4.png" alt="Game 4"></a>
          <a href="pong.html" class="game-slot"><img src="assets/slots/5.png" alt="Game 5"></a>
          <a href="pong.html" class="game-slot"><img src="assets/slots/6.png" alt="Game 6"></a>
          <a href="pong.html" class="game-slot"><img src="assets/slots/7.png" alt="Game 7"></a>
          <a href="pong.html" class="game-slot"><img src="assets/slots/8.png" alt="Game 8"></a>

        </div>
      </div>

      <div class="ad">Iklan</div>

  </div>

</html>
