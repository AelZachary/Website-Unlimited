<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unlimited - Break The Limit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0b0033;
    }
    .ad-section {
      background-color: #5d5775;
    }
    .bg-primary {
      background-color: #07003c !important;
    }
    footer {
      background-color: #d4d1e3;
    }
    nav a:hover, nav a.active {
      color: #00aaff;
    }
    .top-bar {
      font-size: 20px;
      padding: 2px 15px;
      background-color: #ffffff;
      color: #000;
      display: flex;
      justify-content: space-between;
    }
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 15px;
    }
    .game-grid img {
      width: 120px;
      height: 120px;
    }
    @media (max-width: 768px) {
      .game-grid img {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="container-fluid px-0">
    <div class="top-bar">
      <span>Contact Us</span>
      <div>
        <span class="me-2">Login</span>
        <span>Sign in</span>
      </div>
    </div>

    <header class="text-white py-3">
      <div class="main-container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <img src="assets/home gambar/logo unlimited.jpeg" alt="Logo" height="120" class="me-2" />
          <div>
            <strong>Unlimited</strong><br />
            Break The Limit
          </div>
        </div>
        <nav class="d-flex gap-3 align-items-center flex-wrap">
          <a href="#" class="text-white text-decoration-none active">Home</a>
          <a href="#" class="text-white text-decoration-none">Slots</a>
          <a href="#" class="text-white text-decoration-none">Casino</a>
          <a href="#" class="text-white text-decoration-none">Sports</a>
          <a href="#" class="text-white text-decoration-none">Arcade</a>
          <a href="#" class="text-white text-decoration-none">Poker</a>
          <a href="#" class="text-white text-decoration-none">Live TV</a>
        </nav>
      </div>
    </header>

    <div class="ad-section d-flex justify-content-between align-items-center px-3 py-2">
      <button class="btn btn-light">&larr;</button>
      <span class="text-white">Iklan</span>
      <button class="btn btn-light">&rarr;</button>
    </div>

    <div class="py-5">
      <div class="main-container bg-primary rounded-4 p-4">
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-4 justify-content-center game-grid">
          <div class="col d-flex justify-content-center">
            <img src="assets/home gambar/zeus judi.webp" alt="Game 1" class="rounded-4">
          </div>
          <div class="col d-flex justify-content-center">
            <img src="assets/home gambar/mahjong.webp" alt="Game 2" class="rounded-4">
          </div>
          <div class="col d-flex justify-content-center">
            <img src="assets/home gambar/zeus gacor.webp" alt="Game 3" class="rounded-4">
          </div>
          <div class="col d-flex justify-content-center">
            <img src="assets/home gambar/bola.webp" alt="Game 4" class="rounded-4">
          </div>
          <div class="col d-flex justify-content-center">
            <img src="assets/home gambar/slotststsa.webp" alt="Game 5" class="rounded-4">
          </div>
          <div class="col d-flex justify-content-center">
            <img src="assets/home gambar/rhinoo.webp" alt="Game 6" class="rounded-4">
          </div>
        </div>
      </div>
    </div>

    <footer class="text-dark py-4">
      <div class="main-container d-flex justify-content-between flex-wrap text-center">
        <div><strong>About</strong></div>
        <div><strong>Pusat Bantuan</strong></div>
        <div><strong>Syarat dan Ketentuan</strong></div>
      </div>
    </footer>
  </div>
</body>
</html>
